[project]
name = "comfyui-rulznodes"
description = "RulZ nodes for ComfyUI: Load Image with HEIC/HEIF support and a filename output, a resumable one-image-per-run batch loader, a Reference loader with 1 to 16 image slots and outputs, an Image Browser sidebar tab that sends selected images from any folder to the batch loader, Mask Intelligent Crop, an advanced Resize Image with megapixel and input-size targets, DeskinTexture to remove honeycomb skin texture, a per-workflow Disable Comfy Compiler model patch, a seeded Random Prompt Selector that picks a line from a text file, a click-to-mask Person Select built on SAM 3, block-sparse SageAttention for Qwen Image 2.1, a Generate Text that writes several answers in one pass, a Claude Vision that asks Claude about images through the Anthropic API, an OpenRouter Vision that asks any OpenRouter model about images, and a loader that has Load Diffusion Model, Load CLIP and Load VAE in one node."
version = "1.14.0"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
dependencies = ["pillow-heif", "anthropic"]

[project.urls]
Repository = "https://github.com/speedyrulz/ComfyUI-RulZnodes"

[tool.comfy]
PublisherId = "speedyrulz"
DisplayName = "RulZnodes"
Icon = "https://raw.githubusercontent.com/speedyrulz/ComfyUI-RulZnodes/main/assets/icon.png"
