name: Publish to Comfy Registry

# Publishes a new version to registry.comfy.org (and so ComfyUI-Manager)
# whenever pyproject.toml changes on main. Bump `version` to release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish custom node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'speedyrulz' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
